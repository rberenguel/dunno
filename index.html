<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>dunno</title>
  <link rel="icon" href="icon.png" type="image/png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#dde3ff" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="dark">
  <div id="tab-bar"></div>
  <div id="layout"></div>
  <div id="modal" class="modal-overlay hidden">
    <div class="modal-box">
      <p id="modal-msg">Unsaved changes — close anyway?</p>
      <div class="modal-actions">
        <button id="modal-cancel">Cancel</button>
        <button id="modal-confirm">Close</button>
      </div>
    </div>
  </div>
  <script src="libs/marked.min.js"></script>
  <script src="libs/math.js"></script>
  <script src="libs/prettier/standalone.js"></script>
  <script src="libs/prettier/babel.js"></script>
  <script src="libs/prettier/estree.js"></script>
  <script src="libs/prettier/postcss.js"></script>
  <script src="libs/prettier/markdown.js"></script>
  <script src="libs/prettier/html.js"></script>
  <script src="libs/prettier/yaml.js"></script>
  <script type="module" src="js/main.js"></script>
  <script>
    if ('serviceWorker' in navigator)
      navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
  </script>
</body>
</html>
