  <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --tag-bg:        #dde3ff;
  --tag-bg-active: #b8c4ff;
  --tag-fg:        #000000;
  --body-bg:       #ffffff;
  --border:        #9999bb;
  --font-mono:     'Menlo', 'Monaco', 'Consolas', monospace;
  --diff-del-bg:     #fff0f0;
  --diff-del-fg:     #880000;
  --diff-del-gutter: #cc3333;
  --diff-del-word:   #ffcccc;
  --diff-ins-bg:     #f0fff0;
  --diff-ins-fg:     #006600;
  --diff-ins-gutter: #33aa33;
  --diff-ins-word:   #ccffcc;
  --diff-eq-fg:      #333333;
}

body.dark {
  --tag-bg:        #1e2040;
  --tag-bg-active: #2d3060;
  --tag-fg:        #ccccee;
  --body-bg:       #0f1020;
  --border:        #3a3a6a;
  --diff-del-bg:     #2a1010;
  --diff-del-fg:     #ff9999;
  --diff-del-gutter: #cc4444;
  --diff-del-word:   #4a2020;
  --diff-ins-bg:     #102a10;
  --diff-ins-fg:     #99ff99;
  --diff-ins-gutter: #44aa44;
  --diff-ins-word:   #204a20;
  --diff-eq-fg:      #aaaacc;
}

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--body-bg);
  color: var(--tag-fg);
}

#layout {
  display: flex;
  flex-direction: row;
  height: 100vh;
  width: 100vw;
  overflow: hidden;
}

/* ── Columns ────────────────────────────────────────────── */

.column {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-width: 0;
  border-right: 1px solid var(--border);
}
.column:last-child { border-right: none; }

/* ── Column resize handle ───────────────────────────────── */

.resize-h {
  flex-shrink: 0;
  width: 4px;
  background: var(--border);
  cursor: ew-resize;
  transition: background 0.15s;
  z-index: 5;
}
.resize-h:hover { background: var(--tag-bg-active); }

/* ── Panes ──────────────────────────────────────────────── */

.pane {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
  border-bottom: 1px solid var(--border);
}
.pane:last-child { border-bottom: none; }

/* ── Pane resize handle ─────────────────────────────────── */

.resize-v {
  flex-shrink: 0;
  height: 4px;
  background: var(--border);
  cursor: ns-resize;
  transition: background 0.15s;
  z-index: 5;
}
.resize-v:hover { background: var(--tag-bg-active); }

/* ── Tag bar ────────────────────────────────────────────── */

.pane-tag-bar {
  display: flex;
  align-items: stretch;
  flex-shrink: 0;
  background: var(--tag-bg);
  border-bottom: 1px solid var(--border);
}

.pane.active > .pane-tag-bar {
  background: var(--tag-bg-active);
}

.pane-filename {
  display: flex;
  align-items: center;
  padding: 3px 4px 3px 8px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--tag-fg);
  opacity: 0.65;
  white-space: nowrap;
  user-select: none;
  cursor: default;
}

.pane-dirty {
  display: flex;
  align-items: center;
  padding: 3px 6px 3px 0;
  font-family: var(--font-mono);
  font-size: 12px;
  color: #ff8844;
  user-select: none;
  cursor: default;
}

.pane-tag {
  flex: 1;
  min-width: 0;
  padding: 3px 8px;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.5;
  white-space: nowrap;
  overflow-x: auto;
  overflow-y: hidden;
  outline: none;
  cursor: text;
  scrollbar-width: none;
}
.pane-tag::-webkit-scrollbar { display: none; }

/* ── Pane body ──────────────────────────────────────────── */

.pane-body {
  flex: 1;
  overflow-y: auto;
  background: var(--body-bg);
  position: relative;
}

/* ── Editor ─────────────────────────────────────────────── */

.editor {
  min-height: 100%;
  padding: 14px 18px;
  outline: none;
  font-family: var(--font-mono);
  font-size: 14px;
  line-height: 1.7;
  white-space: pre-wrap;
  word-break: break-word;
  color: var(--tag-fg);
  overflow-y: visible !important;
}

/* ── Display pane (plot output etc.) ───────────────────── */

.pane-display {
  width: 100%;
  height: 100%;
  overflow: auto;
}

.pane-display svg {
  display: block;
  width: 100%;
  height: 100%;
}

/* ── Diff gutter overlay (left edge) ───────────────────── */

.diff-gutter {
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  width: 6px;
  pointer-events: auto;
  cursor: pointer;
  z-index: 10;
}

.diff-mark {
  position: absolute;
  left: 0;
  width: 6px;
}

.diff-mark-del { background: var(--diff-del-gutter); }
.diff-mark-ins { background: var(--diff-ins-gutter); }

/* ── Find gutter overlay (right edge) ──────────────────── */

.find-gutter {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: 6px;
  pointer-events: none;
  z-index: 10;
}

.find-mark {
  position: absolute;
  right: 0;
  width: 6px;
  background: #bb9900;
  opacity: 0.7;
}

.find-mark-current {
  background: #ff8800;
  opacity: 1;
  width: 8px;
  right: -1px;
}

/* ── Find/Replace bar ───────────────────────────────────── */

.find-bar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 4px;
  padding: 4px 8px;
  background: var(--tag-bg);
  border-top: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: 12px;
}

.find-bar input {
  background: var(--body-bg);
  color: var(--tag-fg);
  border: 1px solid var(--border);
  padding: 2px 6px;
  font-family: var(--font-mono);
  font-size: 12px;
  outline: none;
  min-width: 140px;
}
.find-bar input:focus { border-color: var(--tag-bg-active); }

.find-count {
  color: var(--tag-fg);
  opacity: 0.6;
  min-width: 44px;
  text-align: center;
}

.find-btn {
  background: transparent;
  color: var(--tag-fg);
  border: 1px solid var(--border);
  padding: 1px 6px;
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: 12px;
}
.find-btn:hover { background: var(--tag-bg-active); }

/* ── Toast ──────────────────────────────────────────────── */

.dunno-toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: var(--tag-bg-active);
  color: var(--tag-fg);
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 6px 14px;
  border: 1px solid var(--border);
  opacity: 0;
  transition: opacity 0.15s, transform 0.15s;
  pointer-events: none;
  z-index: 100;
  white-space: nowrap;
}
.dunno-toast-show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ── Scrollbars ─────────────────────────────────────────── */

:root {
  --scroll-thumb: #b0b4cc;
  --scroll-track: transparent;
}
body.dark {
  --scroll-thumb: #3a3a6a;
}

.pane-body, .pane-display {
  scrollbar-width: thin;
  scrollbar-color: var(--scroll-thumb) var(--scroll-track);
}
.pane-body::-webkit-scrollbar,
.pane-display::-webkit-scrollbar { width: 6px; height: 6px; }
.pane-body::-webkit-scrollbar-track,
.pane-display::-webkit-scrollbar-track { background: var(--scroll-track); }
.pane-body::-webkit-scrollbar-thumb,
.pane-display::-webkit-scrollbar-thumb {
  background: var(--scroll-thumb);
  border-radius: 3px;
}
.pane-body::-webkit-scrollbar-thumb:hover,
.pane-display::-webkit-scrollbar-thumb:hover { background: var(--tag-bg-active); }

/* ── Markdown preview ───────────────────────────────────── */

.preview-content {
  padding: 32px 40px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  font-size: 15px;
  line-height: 1.75;
  color: var(--tag-fg);
  max-width: 720px;
}

.preview-content h1,
.preview-content h2,
.preview-content h3,
.preview-content h4,
.preview-content h5,
.preview-content h6 {
  margin: 1.8em 0 0.5em;
  line-height: 1.25;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.preview-content h1 { font-size: 2em;   border-bottom: 1px solid var(--border); padding-bottom: 0.3em; margin-top: 0; }
.preview-content h2 { font-size: 1.4em; border-bottom: 1px solid var(--border); padding-bottom: 0.2em; }
.preview-content h3 { font-size: 1.15em; }
.preview-content h4 { font-size: 1em; opacity: 0.8; }

.preview-content p   { margin: 0.9em 0; }
.preview-content ul,
.preview-content ol  { margin: 0.6em 0 0.6em 1.8em; }
.preview-content li  { margin: 0.25em 0; }

.preview-content a { color: #6688ee; text-decoration: none; }
.preview-content a:hover { text-decoration: underline; }
body.dark .preview-content a { color: #88aaff; }

.preview-content code {
  font-family: var(--font-mono);
  font-size: 0.85em;
  background: var(--tag-bg);
  padding: 0.15em 0.4em;
  border-radius: 3px;
}

.preview-content pre {
  font-family: var(--font-mono);
  font-size: 0.85em;
  background: var(--tag-bg);
  padding: 14px 18px;
  overflow-x: auto;
  margin: 1.1em 0;
  border-radius: 4px;
  border-left: 3px solid var(--border);
  line-height: 1.55;
}
.preview-content pre code { background: none; padding: 0; font-size: inherit; }

.preview-content blockquote {
  border-left: 3px solid var(--border);
  margin: 1em 0;
  padding: 0.3em 1.2em;
  opacity: 0.7;
  font-style: italic;
}

.preview-content hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 2em 0;
}

.preview-content table {
  border-collapse: collapse;
  margin: 1em 0;

}
.preview-content th,
.preview-content td {

  padding: 6px 14px;
  text-align: left;
}
.preview-content th { background: var(--tag-bg); font-weight: 600; }
.preview-content tr:nth-child(even) td { background: color-mix(in srgb, var(--tag-bg) 40%, transparent); }

.preview-content strong { font-weight: 600; }
.preview-content em { font-style: italic; }

/* ── Help panel ─────────────────────────────────────────── */

.help-content {
  padding: 20px 28px;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.6;
  color: var(--tag-fg);
}

.help-content h2 {
  margin: 0 0 1.2em;
  font-size: 1.2em;
  border-bottom: 1px solid var(--border);
  padding-bottom: 0.3em;
}

.help-inspiration {
  opacity: 0.4;
  font-size: 0.85em;
  margin: -0.8em 0 1.4em;
}

.help-section { margin-bottom: 1.2em; }

.help-section h3 {
  font-size: 0.78em;
  font-weight: normal;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  opacity: 0.5;
  margin: 0 0 0.3em;
}

.help-row {
  display: flex;
  gap: 1.2em;
  padding: 0.05em 0;
}

.help-cmd {
  min-width: 14ch;
  color: var(--tag-bg-active);
  flex-shrink: 0;
}
body.dark .help-cmd { color: #aabbff; }

.help-desc { opacity: 0.8; }

.help-topic-body {
  white-space: pre-wrap;
  line-height: 1.7;
  opacity: 0.9;
}

.help-version {
  font-size: 0.55em;
  font-weight: normal;
  opacity: 0.45;
  vertical-align: middle;
  margin-left: 0.4em;
}

.help-tip {
  margin-top: 1.4em;
  opacity: 0.5;
  font-size: 0.9em;
}

// ── diff.js ──

function lcs(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({length: m + 1}, () => new Int32Array(n + 1));
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++)
      dp[i][j] = a[i-1] === b[j-1]
        ? dp[i-1][j-1] + 1
        : Math.max(dp[i-1][j], dp[i][j-1]);
  const out = [];
  let i = m, j = n;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && a[i-1] === b[j-1]) {
      out.push({ type: 'eq',  tok: a[i-1] }); i--; j--;
    } else if (j > 0 && (i === 0 || dp[i][j-1] >= dp[i-1][j])) {
      out.push({ type: 'ins', tok: b[j-1] }); j--;
    } else {
      out.push({ type: 'del', tok: a[i-1] }); i--;
    }
  }
  return out.reverse();
}

// Split into words + whitespace tokens so spaces are preserved
function tokenize(s) { return s.match(/\S+|\s+/g) ?? []; }

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Word-level diff between two lines; returns {delHtml, insHtml}
function wordDiff(a, b) {
  const hunks = lcs(tokenize(a), tokenize(b));
  let delHtml = '', insHtml = '';
  for (const h of hunks) {
    const e = esc(h.tok);
    if (h.type === 'eq')  { delHtml += e; insHtml += e; }
    if (h.type === 'del') { delHtml += `<mark class="word-del">${e}</mark>`; }
    if (h.type === 'ins') { insHtml += `<mark class="word-ins">${e}</mark>`; }
  }
  return { delHtml, insHtml };
}

// Line-level diff
function diffLines(a, b) {
  return lcs((a || '').split('\n'), (b || '').split('\n'));
}

// Render: consecutive del+ins → word-level mod; lone del/ins → full-line colour
function renderDiffHtml(hunks) {
  const parts = [];
  let i = 0;
  while (i < hunks.length) {
    const h = hunks[i];
    if (h.type === 'del' && i + 1 < hunks.length && hunks[i + 1].type === 'ins') {
      const { delHtml, insHtml } = wordDiff(h.tok, hunks[i + 1].tok);
      parts.push(`<span class="diff-del diff-mod">${delHtml}</span>`);
      parts.push(`<span class="diff-ins diff-mod">${insHtml}</span>`);
      i += 2;
    } else if (h.type === 'eq') {
      parts.push(`<span class="diff-eq">${esc(h.tok)}</span>`);
      i++;
    } else if (h.type === 'del') {
      parts.push(`<span class="diff-del">${esc(h.tok)}</span>`);
      i++;
    } else {
      parts.push(`<span class="diff-ins">${esc(h.tok)}</span>`);
      i++;
    }
  }
  return parts.join('');
}

    const aboveH  = heights[handleIdx];
    const belowH  = heights[handleIdx + 1];

    const onUp = () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
    };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  });
}

function _rebuildColHandles() {
  _layout().querySelectorAll('.resize-h').forEach(h => h.remove());
  const colEls = _colOrder.map(id => _cols.get(id)?.el).filter(Boolean);
  if (colEls.length === 1) {
    colEls[0].style.flex = '';
    return;
  }
  for (let i = 0; i < colEls.length - 1; i++) {
    const h = document.createElement('div');
    h.className = 'resize-h';
    colEls[i].after(h);
    _initHResize(h);
  }
}

// ── Panes ──────────────────────────────────────────────────────────────────────

function createPane(colId, content = '', tagText = null) {
  const id  = uid();
  const col = _cols.get(colId);
  if (!col) return null;

  const el         = document.createElement('div');
  const tagBarEl   = document.createElement('div');
  const filenameEl = document.createElement('span');
  const dirtyEl    = document.createElement('span');
  const tagEl      = document.createElement('div');
  const bodyEl     = document.createElement('div');
  const editorEl   = document.createElement('div');

  el.className       = 'pane';
  el.dataset.paneId  = id;

  tagBarEl.className = 'pane-tag-bar';

  filenameEl.className = 'pane-filename';
  filenameEl.hidden    = true;

  dirtyEl.className  = 'pane-dirty';
  dirtyEl.textContent = '·';
  dirtyEl.hidden     = true;

  tagEl.className       = 'pane-tag';
  tagEl.contentEditable = 'true';
  tagEl.spellcheck      = false;
  tagEl.textContent     = tagText ?? 'Del New Newcol Help';
  tagEl.addEventListener('keydown', e => { if (e.key === 'Enter') e.preventDefault(); });

  bodyEl.className   = 'pane-body';
  editorEl.className = 'editor';

  bodyEl.appendChild(editorEl);
  tagBarEl.appendChild(filenameEl);
  tagBarEl.appendChild(dirtyEl);
  tagBarEl.appendChild(tagEl);
  el.appendChild(tagBarEl);
  el.appendChild(bodyEl);
  col.el.appendChild(el);
  col.paneIds.push(id);

  _suppressDirtyFor.add(id);
  const jar = CodeJar(editorEl, () => {
    if (!_suppressDirtyFor.has(id)) _markDirty(id);
  }, { tab: '  ', preserveIdent: true, addClosing: false, catchTab: true, history: true });
  editorEl.style.overflowY = 'visible';
  if (content) jar.updateCode(content);
  _suppressDirtyFor.delete(id);

  tagBarEl.addEventListener('contextmenu', e => _onContextMenu(e, id));
  editorEl.addEventListener('contextmenu', e => _onContextMenu(e, id));
  bodyEl.addEventListener('contextmenu',   e => { if (!editorEl.contains(e.target)) _onContextMenu(e, id); });
  tagBarEl.addEventListener('mousedown',   () => _setActive(id));
  editorEl.addEventListener('mousedown',   () => _setActive(id));

  bodyEl.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
  bodyEl.addEventListener('drop', e => {
    e.preventDefault();
    _setActive(id);
    const file = e.dataTransfer.files[0];
    if (file && _fileDropHandler) _fileDropHandler(id, file);
  });

  _panes.set(id, {
    id, colId, el, tagBarEl, filenameEl, dirtyEl, tagEl, bodyEl, editorEl, jar,
    mode: 'edit', savedContent: null,
    dirty: false, fileHandle: null, filename: null,
    plotOutputId: null, evalOutputId: null,
  });
  _setActive(id);
  return id;
}

function deletePane(paneId) {
  if (_panes.size <= 1) return;
  const pane = _panes.get(paneId);
  if (!pane) return;
  const colId = pane.colId;
  const col   = _cols.get(colId);

  pane.el.remove();
  _panes.delete(paneId);
  if (col) col.paneIds = col.paneIds.filter(id => id !== paneId);

  if (col && col.paneIds.length === 0) {
    _deleteColumn(colId);
    _rebuildColHandles();
  } else {
    _rebuildPaneHandles(colId);
  }

  if (_activeId === paneId) {
    _activeId = null;
    const first = _panes.values().next().value;
    if (first) { _setActive(first.id); first.editorEl.focus(); }
  }
}

function splitPane(paneId) {
  const pane = _panes.get(paneId);
  if (!pane) return;
  const newId   = createPane(pane.colId);
  const newPane = _panes.get(newId);
  const col     = _cols.get(pane.colId);

  pane.el.after(newPane.el);
  col.paneIds = col.paneIds.filter(id => id !== newId);
  const idx = col.paneIds.indexOf(paneId);
  col.paneIds.splice(idx + 1, 0, newId);

  _rebuildPaneHandles(pane.colId);
  newPane.editorEl.focus();
  return newId;
}

function addColumn(paneId) {
  const pane = _panes.get(paneId);
  if (!pane) return;
  const newColId = createColumn(pane.colId);
  createPane(newColId);
  _rebuildColHandles();
}

// ── Diff ───────────────────────────────────────────────────────────────────────

const EDITOR_LINE_H = 14 * 1.7;
const EDITOR_PAD_T  = 14;

function _exitDiff(pane) {
  pane.bodyEl.querySelector('.diff-gutter')?.remove();
  pane.mode = 'edit';
}

function diffPane(paneId) {
  const pane = _panes.get(paneId);
  if (!pane) return;

  if (pane.mode === 'diff') { _exitDiff(pane); return; }

  const other = _panes.get(_prevActiveId);
  if (!other || other.id === paneId) return;

  const hunks = diffLines(pane.jar.toString(), other.jar.toString());

  const gutterEl = document.createElement('div');
  gutterEl.className = 'diff-gutter';
  gutterEl.addEventListener('click', () => _exitDiff(pane));

  let lineIdx = 0;
  for (const h of hunks) {
    if (h.type === 'eq') {
      lineIdx++;
    } else if (h.type === 'del') {
      const mark = document.createElement('div');
      mark.className = 'diff-mark diff-mark-del';
      mark.style.top    = `${EDITOR_PAD_T + lineIdx * EDITOR_LINE_H}px`;
      mark.style.height = `${EDITOR_LINE_H}px`;
      gutterEl.appendChild(mark);
      lineIdx++;
    } else {
      const mark = document.createElement('div');
      mark.className = 'diff-mark diff-mark-ins';
      mark.style.top    = `${EDITOR_PAD_T + lineIdx * EDITOR_LINE_H - 2}px`;
      mark.style.height = `4px`;
      gutterEl.appendChild(mark);
    }
  }

  pane.bodyEl.appendChild(gutterEl);
  pane.mode = 'diff';
}

// ── Display pane (plot output etc.) ───────────────────────────────────────────

function setPaneDisplay(paneId, html) {
  const pane = _panes.get(paneId);
  if (!pane) return;
  pane.editorEl.style.display = 'none';
  let el = pane.bodyEl.querySelector('.pane-display');
  if (!el) {
    el = document.createElement('div');
    el.className = 'pane-display';
    pane.bodyEl.appendChild(el);
  }
  el.innerHTML = html;
}

// ── State serialisation ────────────────────────────────────────────────────────

function getState() {
  const state = { colOrder: [..._colOrder], cols: {}, panes: {} };
  for (const [id, col] of _cols)
    state.cols[id] = {
      paneIds:   [...col.paneIds],
      flexBasis: col.el.style.flexBasis || null,
    };
  for (const [id, pane] of _panes)
    state.panes[id] = {
      colId:     pane.colId,
      tag:       pane.tagEl.textContent,
      content:   pane.mode === 'diff' ? (pane.savedContent ?? '') : pane.jar.toString(),
      filename:  pane.filename || null,
      flexBasis: pane.el.style.flexBasis || null,
    };
  return state;
}

function restoreState(state) {
  _layout().innerHTML = '';
  _cols.clear(); _panes.clear();
  _colOrder = []; _activeId = null; _prevActiveId = null;

  for (const colId of state.colOrder) {
    const colData = state.cols[colId];
    if (!colData) continue;
    const newColId = createColumn();
    const col = _cols.get(newColId);
    if (colData.flexBasis && col) col.el.style.flex = `0 0 ${colData.flexBasis}`;

    for (const paneId of colData.paneIds) {
      const p = state.panes[paneId];
      if (!p) continue;
      const newPaneId = createPane(newColId, p.content, p.tag);
      if (!newPaneId) continue;
      const pane = _panes.get(newPaneId);
      if (!pane) continue;
      if (p.flexBasis) pane.el.style.flex = `0 0 ${p.flexBasis}`;
      if (p.filename) {
        pane.filename = p.filename;
        pane.filenameEl.textContent = p.filename;
        pane.filenameEl.hidden = false;
      }
      clearDirty(newPaneId);
    }
    _rebuildPaneHandles(newColId);
  }
  _rebuildColHandles();
}


// ── plot.js ──

// Gnuplot-compatible (reduced) parser and SVG renderer.
//
// Supported:
//   set title / xlabel / ylabel / xrange / yrange / grid / key / datafile separator
//   plot "-" using X:Y with lines|points|linespoints|dots|impulses|boxes|bars|area|steps title "..."
//
// "-" always refers to the data pane (equivalent to stdin in real gnuplot).
// Multiple series separated by commas.

const COLORS = ['#5599ff','#ff6644','#44cc88','#ffaa22','#cc55ff','#44ddcc','#ff4488','#aacc22'];

// ── Parser ─────────────────────────────────────────────────────────────────────

function parsePlotSpec(text) {
  const spec = {
    title: '', xlabel: '', ylabel: '',
    xrange: null, yrange: null,
    grid: false, key: 'top right',
    separator: null,
    series: [],
  };
  const src = text.replace(/\\\n\s*/g, ' ');
  for (const raw of src.split('\n')) {
    const line = raw.trim();
    if (!line || line.startsWith('#')) continue;
    _cmd(line, spec);
  }
  return spec;
}

function _cmd(line, spec) {
  let m;
  if ((m = line.match(/^set\s+(\w+)\s*(.*)/s))) {
    _set(m[1], m[2].trim(), spec);
  } else if (line.match(/^plot(\s|$)/)) {
    spec.series = _plotArgs(line.slice(4).trim());
  }
}

function _set(key, rest, spec) {
  switch (key) {
    case 'title':    spec.title  = _str(rest); break;
    case 'xlabel':   spec.xlabel = _str(rest); break;
    case 'ylabel':   spec.ylabel = _str(rest); break;
    case 'xrange':   spec.xrange = _range(rest); break;
    case 'yrange':   spec.yrange = _range(rest); break;
    case 'grid':     spec.grid   = !rest.startsWith('no'); break;
    case 'key':      spec.key    = rest || 'top right'; break;
    case 'datafile': {
      const m = rest.match(/separator\s+["']?([^"'\s]+)["']?/);
      if (m) spec.separator = (m[1] === 'tab' || m[1] === '\\t') ? '\t' : m[1];
      break;
    }
  }
}

function _str(s)  { const m = s.match(/^["'](.*)["']$/); return m ? m[1] : s; }
function _range(s) {
  const m = s.match(/\[\s*([^:\]]+)\s*:\s*([^\]]+)\s*\]/);
  if (!m) return null;
  const lo = m[1].trim(), hi = m[2].trim();
  return [lo === '*' ? null : +lo, hi === '*' ? null : +hi];
}

function _plotArgs(s) { return _splitSeries(s).map(_series); }

function _splitSeries(s) {
  const out = []; let depth = 0, inStr = false, ch = '', start = 0;
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (inStr) { if (c === ch) inStr = false; }
    else if (c === '"' || c === "'") { inStr = true; ch = c; }
    else if (c === '[') depth++;
    else if (c === ']') depth--;
    else if (c === ',' && !depth) { out.push(s.slice(start, i).trim()); start = i + 1; }
  }
  out.push(s.slice(start).trim());
  return out.filter(Boolean);
}

function _series(s) {
  const ser = { using: [1, 2], style: 'lines', title: null };
  // Strip source token (filename or "-") — we always use the data pane
  s = s.replace(/^["'][^"']*["']\s*/, '').replace(/^-\s*/, '');
  let m;
  if ((m = s.match(/\busing\s+([\d:]+)/))) {
    const cols = m[1].split(':').map(Number);
    // Column 0 = record number (gnuplot convention)
    ser.using = cols.length >= 2 ? [cols[0], cols[1]] : [0, cols[0]];
  }
  if ((m = s.match(/\bwith\s+(\w+)/)))              ser.style = m[1];
  if ((m = s.match(/\btitle\s+["']([^"']*)["']/)))  ser.title = m[1];
  return ser;
}

// ── Data parser ────────────────────────────────────────────────────────────────

function _parseData(text, separator) {
  const lines = text.trim().split('\n')
    .map(l => l.trim()).filter(l => l && !l.startsWith('#'));
  if (!lines.length) return { headers: [], rows: [] };

  const sep = separator ??
    (lines[0].includes('\t') ? '\t' : lines[0].includes(',') ? ',' : null);
  const split = sep ? l => l.split(sep).map(s => s.trim())
                     : l => l.trim().split(/\s+/);

  const raw = lines.map(split);
  let headers = [], rows = raw;
  if (raw[0].some(v => v && isNaN(+v))) { headers = raw[0]; rows = raw.slice(1); }
  return { headers, rows: rows.map(r => r.map(Number)) };
}

// ── SVG renderer ───────────────────────────────────────────────────────────────

const VW = 700, VH = 440;
const M  = { top: 38, right: 28, bottom: 54, left: 64 };
const PW = VW - M.left - M.right;
const PH = VH - M.top  - M.bottom;

function renderSVG(spec, dataText) {
  const { rows } = _parseData(dataText, spec.separator);
  if (!rows.length) return _err('No data');

  // Collect all X and Y values across series to compute domains
  const allX = [], allY = [];
  for (const s of spec.series) {
    rows.forEach((row, ri) => {
      const x = s.using[0] === 0 ? ri + 1 : row[s.using[0] - 1];
      const y = row[s.using[1] - 1];
      if (isFinite(x)) allX.push(x);
      if (isFinite(y)) allY.push(y);
    });
  }
  if (!allX.length || !allY.length) return _err('No numeric data');

  const xd = _domain(allX, spec.xrange, false);
  const yd = _domain(allY, spec.yrange, _needsZero(spec));
  const xs = v => (v - xd[0]) / (xd[1] - xd[0]) * PW;
  const ys = v => PH - (v - yd[0]) / (yd[1] - yd[0]) * PH;

  const xTicks = _ticks(...xd);
  const yTicks = _ticks(...yd);

  let g = '';

  // Grid
  if (spec.grid) {
    for (const t of xTicks)
      g += `<line x1="${f(xs(t))}" y1="0" x2="${f(xs(t))}" y2="${PH}" stroke="#1e1e3a" stroke-width="1"/>`;
    for (const t of yTicks)
      g += `<line x1="0" y1="${f(ys(t))}" x2="${PW}" y2="${f(ys(t))}" stroke="#1e1e3a" stroke-width="1"/>`;
  }

  // Zero lines (if in range)
  if (xd[0] < 0 && xd[1] > 0)
    g += `<line x1="${f(xs(0))}" y1="0" x2="${f(xs(0))}" y2="${PH}" stroke="#44445a" stroke-width="1"/>`;
  if (yd[0] < 0 && yd[1] > 0)
    g += `<line x1="0" y1="${f(ys(0))}" x2="${PW}" y2="${f(ys(0))}" stroke="#44445a" stroke-width="1"/>`;

  // Series (clipped)
  g += `<g clip-path="url(#pa)">`;
  spec.series.forEach((s, i) => {
    const color = COLORS[i % COLORS.length];
    const pts = rows.map((row, ri) => [
      s.using[0] === 0 ? ri + 1 : row[s.using[0] - 1],
      row[s.using[1] - 1],
    ]).filter(([x, y]) => isFinite(x) && isFinite(y));
    g += _renderSeries(pts, s.style, color, xs, ys);
  });
  g += '</g>';

  // Axes
  g += `<line x1="0" y1="0" x2="0" y2="${PH}" stroke="#7777aa" stroke-width="1.5"/>`;
  g += `<line x1="0" y1="${PH}" x2="${PW}" y2="${PH}" stroke="#7777aa" stroke-width="1.5"/>`;

  // X ticks + labels
  for (const t of xTicks) {
    const x = xs(t); if (x < -1 || x > PW + 1) continue;
    g += `<line x1="${f(x)}" y1="${PH}" x2="${f(x)}" y2="${PH + 5}" stroke="#7777aa"/>`;
    g += `<text x="${f(x)}" y="${PH + 18}" text-anchor="middle" fill="#8888aa" font-size="11" font-family="monospace">${_ft(t)}</text>`;
  }

  // Y ticks + labels
  for (const t of yTicks) {
    const y = ys(t); if (y < -1 || y > PH + 1) continue;
    g += `<line x1="-5" y1="${f(y)}" x2="0" y2="${f(y)}" stroke="#7777aa"/>`;
    g += `<text x="-8" y="${f(y + 4)}" text-anchor="end" fill="#8888aa" font-size="11" font-family="monospace">${_ft(t)}</text>`;
  }

  // Axis labels
  if (spec.xlabel) g += `<text x="${PW/2}" y="${PH+44}" text-anchor="middle" fill="#aaaacc" font-size="13" font-family="sans-serif">${_e(spec.xlabel)}</text>`;
  if (spec.ylabel) g += `<text x="${-PH/2}" y="-50" text-anchor="middle" fill="#aaaacc" font-size="13" font-family="sans-serif" transform="rotate(-90)">${_e(spec.ylabel)}</text>`;
  if (spec.title)  g += `<text x="${PW/2}" y="-14" text-anchor="middle" fill="#ddddff" font-size="15" font-weight="bold" font-family="sans-serif">${_e(spec.title)}</text>`;

  // Legend
  if (spec.key !== 'off') {
    const labeled = spec.series.filter(s => s.title !== null);
    labeled.forEach((s, i) => {
      const color = COLORS[spec.series.indexOf(s) % COLORS.length];
      const ly = 8 + i * 20, lx = PW - 10;
      g += `<line x1="${lx-22}" y1="${ly+5}" x2="${lx-4}" y2="${ly+5}" stroke="${color}" stroke-width="2"/>`;
      g += `<text x="${lx-26}" y="${ly+9}" text-anchor="end" fill="#aaaacc" font-size="11" font-family="sans-serif">${_e(s.title)}</text>`;
    });
  }

  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${VW} ${VH}" preserveAspectRatio="xMidYMid meet">
<rect width="${VW}" height="${VH}" fill="#0d0e1a"/>
<defs><clipPath id="pa"><rect x="0" y="0" width="${PW}" height="${PH}"/></clipPath></defs>
<g transform="translate(${M.left},${M.top})">${g}</g>
</svg>`;
}

// ── Series renderers ───────────────────────────────────────────────────────────

function _renderSeries(pts, style, color, xs, ys) {
  if (!pts.length) return '';
  switch (style) {
    case 'points':
      return pts.map(([x,y]) => `<circle cx="${f(xs(x))}" cy="${f(ys(y))}" r="3.5" fill="${color}"/>`).join('');
    case 'dots':
      return pts.map(([x,y]) => `<circle cx="${f(xs(x))}" cy="${f(ys(y))}" r="1.5" fill="${color}"/>`).join('');
    case 'linespoints':
      return _renderSeries(pts,'lines',color,xs,ys) + _renderSeries(pts,'points',color,xs,ys);
    case 'impulses': {
      const y0 = f(ys(0));
      return pts.map(([x,y]) => `<line x1="${f(xs(x))}" y1="${y0}" x2="${f(xs(x))}" y2="${f(ys(y))}" stroke="${color}" stroke-width="1.5"/>`).join('');
    }
    case 'boxes':
    case 'bars': {
      const y0 = ys(0);
      const bw = pts.length > 1
        ? Math.max(2, (xs(pts[1][0]) - xs(pts[0][0])) * 0.75)
        : 10;
      return pts.map(([x,y]) => {
        const px = xs(x), py = ys(y);
        return `<rect x="${f(px-bw/2)}" y="${f(Math.min(py,y0))}" width="${f(bw)}" height="${f(Math.abs(py-y0))}" fill="${color}" fill-opacity="0.75"/>`;
      }).join('');
    }
    case 'area': {
      const y0 = ys(0);
      const d = `M${f(xs(pts[0][0]))},${f(y0)} ` +
        pts.map(([x,y]) => `L${f(xs(x))},${f(ys(y))}`).join(' ') +
        ` L${f(xs(pts[pts.length-1][0]))},${f(y0)} Z`;
      return `<path d="${d}" fill="${color}" fill-opacity="0.25"/>` +
             _renderSeries(pts, 'lines', color, xs, ys);
    }
    case 'steps': {
      let d = `M${f(xs(pts[0][0]))},${f(ys(pts[0][1]))}`;
      for (let i = 1; i < pts.length; i++)
        d += ` H${f(xs(pts[i][0]))} V${f(ys(pts[i][1]))}`;
      return `<path d="${d}" fill="none" stroke="${color}" stroke-width="1.5"/>`;
    }
    default: { // lines
      const d = pts.map(([x,y],i) => `${i?'L':'M'}${f(xs(x))},${f(ys(y))}`).join(' ');
      return `<path d="${d}" fill="none" stroke="${color}" stroke-width="1.5"/>`;
    }
  }
}

// ── Helpers ────────────────────────────────────────────────────────────────────

const f = n => n.toFixed(1);

function _needsZero(spec) {
  return spec.series.some(s => ['bars','boxes','impulses','area'].includes(s.style));
}

function _domain(vals, override, extendZero) {
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (extendZero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  if (lo === hi)  { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.05;
  lo -= pad; hi += pad;
  if (override) {
    if (override[0] != null) lo = override[0];
    if (override[1] != null) hi = override[1];
  }
  return [lo, hi];
}

function _ticks(lo, hi, n = 5) {
  const rng = hi - lo;
  const raw = rng / n;
  const exp = Math.floor(Math.log10(raw));
  const frac = raw / 10 ** exp;
  const nice = frac < 1.5 ? 1 : frac < 3 ? 2 : frac < 7 ? 5 : 10;
  const step = nice * 10 ** exp;
  const start = Math.ceil(lo / step) * step;
  const out = [];
  for (let t = start; t <= hi + step * 1e-9; t = +(t + step).toPrecision(12))
    out.push(t);
  return out;
}

function _ft(v) {
  if (v === 0) return '0';
  const a = Math.abs(v);
  return (a >= 1e6 || a < 0.01) ? v.toExponential(1) : String(+v.toPrecision(6));
}

function _e(s) {
  return (s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function _err(msg) {
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80"><rect width="400" height="80" fill="#0d0e1a"/><text x="200" y="45" text-anchor="middle" fill="#ff6644" font-size="14" font-family="sans-serif">${_e(msg)}</text></svg>`;
}


// ── find.js ──

// find.js — find/replace panel embedded in a pane

const LINE_H  = 14 * 1.7; // must match .editor CSS
const PAD_TOP = 14;

function openFind(pane)    { _open(pane, false); }
function openReplace(pane) { _open(pane, true);  }

function closeFind(pane) {
  pane.el.querySelector('.find-bar')?.remove();
  pane.bodyEl.querySelector('.find-gutter')?.remove();
  window.getSelection()?.removeAllRanges();
}

function _open(pane, replaceMode) {
  pane.el.querySelector('.find-bar')?.remove();
  const bar = _makeBar(pane);
  pane.el.appendChild(bar);
  bar.querySelector(replaceMode ? '.rep-input' : '.find-input').focus();
}

function _makeBar(pane) {
  const bar    = document.createElement('div');
  bar.className = 'find-bar';

  const fi     = _inp('find-input', 'find…');
  const ri     = _inp('rep-input',  'replace…');
  const count  = Object.assign(document.createElement('span'), { className: 'find-count', textContent: '' });
  const prev   = _btn('↑');
  const next   = _btn('↓');
  const repOne = _btn('→1');
  const repAll = _btn('→all');
  const close  = _btn('×');

  bar.append(fi, count, prev, next, ri, repOne, repAll, close);

  let matches = [];
  let cur     = -1;

  const search = () => {
    matches = fi.value ? _findAll(pane.jar.toString(), fi.value) : [];
    cur = matches.length ? 0 : -1;
    _showCount(count, matches, cur);
    _drawGutter(pane, matches, cur);
    if (cur >= 0) _select(pane.editorEl, matches[cur]);
  };

  const go = delta => {
    if (!matches.length) return;
    cur = ((cur + delta) % matches.length + matches.length) % matches.length;
    _showCount(count, matches, cur);
    _drawGutter(pane, matches, cur);
    _select(pane.editorEl, matches[cur]);
  };

  fi.addEventListener('input', search);
  fi.addEventListener('keydown', e => {
    if (e.key === 'Enter')  { e.preventDefault(); go(e.shiftKey ? -1 : 1); }
    if (e.key === 'Escape') closeFind(pane);
  });
  ri.addEventListener('keydown', e => { if (e.key === 'Escape') closeFind(pane); });

  prev.addEventListener('click',  () => go(-1));
  next.addEventListener('click',  () => go(1));
  close.addEventListener('click', () => closeFind(pane));

  repOne.addEventListener('click', () => {
    if (cur < 0 || !fi.value) return;
    const m = matches[cur];
    const t = pane.jar.toString();
    pane.jar.updateCode(t.slice(0, m.start) + ri.value + t.slice(m.end));
    matches = fi.value ? _findAll(pane.jar.toString(), fi.value) : [];
    cur = Math.min(cur, matches.length - 1);
    _showCount(count, matches, cur);
    _drawGutter(pane, matches, cur);
    if (cur >= 0) _select(pane.editorEl, matches[cur]);
  });

  repAll.addEventListener('click', () => {
    if (!fi.value) return;
    pane.jar.updateCode(pane.jar.toString().split(fi.value).join(ri.value));
    matches = []; cur = -1;
    _showCount(count, matches, cur);
    _drawGutter(pane, matches, cur);
  });

  return bar;
}

function _inp(cls, ph) {
  return Object.assign(document.createElement('input'), { className: cls, placeholder: ph });
}

function _btn(txt) {
  return Object.assign(document.createElement('button'), { className: 'find-btn', textContent: txt });
}

function _findAll(text, term) {
  const out = [];
  const lo  = term.toLowerCase();
  const src = text.toLowerCase();
  let i = 0;
  while ((i = src.indexOf(lo, i)) >= 0) {
    out.push({ start: i, end: i + term.length });
    i++;
  }
  return out;
}

function _showCount(el, matches, cur) {
  el.textContent = matches.length ? `${cur + 1}/${matches.length}` : '0/0';
}

function _drawGutter(pane, matches, cur) {
  pane.bodyEl.querySelector('.find-gutter')?.remove();
  if (!matches.length) return;

  const text   = pane.jar.toString();
  const gutter = document.createElement('div');
  gutter.className = 'find-gutter';

  const lineOf = pos => text.slice(0, pos).split('\n').length - 1;

  for (let i = 0; i < matches.length; i++) {
    const line = lineOf(matches[i].start);
    const mark = document.createElement('div');
    mark.className = 'find-mark' + (i === cur ? ' find-mark-current' : '');
    mark.style.top    = `${PAD_TOP + line * LINE_H}px`;
    mark.style.height = `${LINE_H}px`;
    gutter.appendChild(mark);
  }

  pane.bodyEl.appendChild(gutter);
}

function _select(editorEl, match) {
  const walker = document.createTreeWalker(editorEl, NodeFilter.SHOW_TEXT);
  let pos = 0, startNode, endNode, startOff, endOff;
  let node;
  while ((node = walker.nextNode())) {
    const len = node.length;
    if (!startNode && pos + len > match.start) {
      startNode = node;
      startOff  = match.start - pos;
    }
    if (startNode && !endNode && pos + len >= match.end) {
      endNode = node;
      endOff  = match.end - pos;
      break;
    }
    pos += len;
  }
  if (!startNode) return;

  const range = document.createRange();
  range.setStart(startNode, startOff);
  range.setEnd(endNode ?? startNode, endOff ?? startOff);

  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  range.startContainer.parentElement?.scrollIntoView({ block: 'nearest' });
}


// ── preview.js ──

function renderPreviewHTML(markdown) {
  if (!window.marked) return '<p style="color:red">marked not loaded</p>';
  const body = window.marked.parse(markdown);
  return `<div class="preview-content">${body}</div>`;
}


// ── version.js ──

// Sentinel replaced by bundle.go at weave time; fetched from manifest at runtime.
let VERSION = '0.2.0';

async function loadVersion() {
  try {
    const r = await fetch('manifest.json');
    const m = await r.json();
    if (m.version) VERSION = m.version;
  } catch {}
}

// Normalise a topic string to a TOPICS key.
function _topic(sel) {
  if (!sel) return null;
  const key = sel.trim().toLowerCase().replace(/[^a-z]/g, '');
  return TOPICS[key] ? key : null;
}

function _renderTopic(key) {
  const { title, body } = TOPICS[key];
  return `<div class="help-content">
<h2>${title}</h2>
<div class="help-topic-body">${body}</div>
</div>`;
}

function _renderGeneral() {
  const sections = SECTIONS.map(({ heading, items }) => {
    const rows = items.map(({ cmd, desc }) =>
      `<div class="help-row"><span class="help-cmd">${cmd}</span><span class="help-desc">${desc}</span></div>`
    ).join('');
    return `<section class="help-section"><h3>${heading}</h3>${rows}</section>`;
  }).join('');
  return `<div class="help-content"><h2>dunno <span class="help-version">${VERSION}</span></h2>
<p class="help-inspiration">Inspired by Plan 9's Acme</p>
${sections}
<p class="help-tip">Tip: select a command name (e.g. <span class="help-cmd">plot</span>) then right-click <span class="help-cmd">Help</span> for details.</p>
</div>`;
}

function renderHelpHTML(selection) {
  const key = _topic(selection);
  return key ? _renderTopic(key) : _renderGeneral();
}


// ── main.js ──









// ── Toast notifications ────────────────────────────────────────────────────────

function _toast(msg, durationMs = 3000) {
  const el = document.createElement('div');
  el.className = 'dunno-toast';
  el.textContent = msg;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('dunno-toast-show'));
  setTimeout(() => {
    el.classList.remove('dunno-toast-show');
    el.addEventListener('transitionend', () => el.remove(), { once: true });
  }, durationMs);
}

// ── Layout commands ────────────────────────────────────────────────────────────

register('Del',    ctx => deletePane(ctx.paneId));
register('New',    ctx => splitPane(ctx.paneId));
register('Newcol', ctx => addColumn(ctx.paneId));
register('Diff',   ctx => diffPane(ctx.paneId));
register('dark',   () => document.body.classList.add('dark'));
register('light',  () => document.body.classList.remove('dark'));

// ── File I/O ───────────────────────────────────────────────────────────────────

function _downloadBlob(paneId) {
  const pane = getPane(paneId);
  if (!pane) return;
  const { name } = getPaneFile(paneId) ?? {};
  const blob = new Blob([pane.jar.toString()], { type: 'text/plain' });
  const url  = URL.createObjectURL(blob);
  const a    = Object.assign(document.createElement('a'), { href: url, download: name || 'untitled.txt' });
  a.click();
  URL.revokeObjectURL(url);
}

register('Load', async ctx => {
  if (!window.showOpenFilePicker) {
    _toast('Drop a file onto this pane to load it');
    return;
  }
  try {
    const [handle] = await window.showOpenFilePicker();
    const file = await handle.getFile();
    loadContent(ctx.paneId, await file.text());
    setPaneFile(ctx.paneId, handle, file.name);
  } catch (e) {
    if (e.name !== 'AbortError') console.error(e);
  }
});

register('Save', async ctx => {
  const { handle } = getPaneFile(ctx.paneId) ?? {};
  if (handle) {
    await _writeToHandle(ctx.paneId, handle);
  } else if (window.showSaveFilePicker) {
    try {
      const h = await window.showSaveFilePicker({ suggestedName: 'untitled.txt' });
      await _writeToHandle(ctx.paneId, h);
      setPaneFile(ctx.paneId, h, h.name ?? 'untitled.txt');
    } catch (e) {
      if (e.name !== 'AbortError') console.error(e);
    }
  } else {
    _downloadBlob(ctx.paneId);
  }
  _sessionSave();
});

setFileDropHandler(async (paneId, file) => {
  loadContent(paneId, await file.text());
  setPaneFile(paneId, null, file.name);
});

register('Get', async ctx => {
  const { handle } = getPaneFile(ctx.paneId) ?? {};
  if (handle) {
    try {
      const file = await handle.getFile();
      loadContent(ctx.paneId, await file.text());
      clearDirty(ctx.paneId);
    } catch (e) { console.error(e); }
  } else {
    _sessionLoad();
  }
});

async function _writeToHandle(paneId, handle) {
  const pane = getPane(paneId);
  if (!pane) return;
  try {
    const w = await handle.createWritable();
    await w.write(pane.jar.toString());
    await w.close();
    clearDirty(paneId);
  } catch (e) { console.error(e); }
}

// ── Eval ───────────────────────────────────────────────────────────────────────

register('Eval', ctx => {
  const code = ctx.pane.jar.toString();
  const logs = [];
  const wrap = (orig, prefix = '') => (...a) => {
    orig(...a);
    logs.push(prefix + a.map(x => (typeof x === 'object' ? JSON.stringify(x) : String(x))).join(' '));
  };
  const origLog  = console.log;
  const origWarn = console.warn;
  const origErr  = console.error;
  console.log   = wrap(origLog);
  console.warn  = wrap(origWarn, 'warn: ');
  console.error = wrap(origErr,  'error: ');

  try {
    // eslint-disable-next-line no-new-func
    const ret = new Function(code)();
    if (ret !== undefined) logs.push(String(ret));
  } catch (e) {
    logs.push('! ' + e.message);
  } finally {
    console.log   = origLog;
    console.warn  = origWarn;
    console.error = origErr;
  }

  const output = logs.join('\n') || '(no output)';
  let outId = ctx.pane.evalOutputId;
  if (!outId || !getPane(outId)) {
    outId = splitPane(ctx.paneId);
    ctx.pane.evalOutputId = outId;
    const out = getPane(outId);
    if (out) out.tagEl.textContent = 'eval-out Del';
  }
  getPane(outId)?.jar.updateCode(output);
});

// ── Plot ───────────────────────────────────────────────────────────────────────

register('Plot', ctx => {
  const dataPane = getPrev();
  if (!dataPane || dataPane.id === ctx.paneId) return;

  const spec = parsePlotSpec(ctx.pane.jar.toString());
  const svg  = renderSVG(spec, dataPane.jar.toString());

  let outId = ctx.pane.plotOutputId;
  if (!outId || !getPane(outId)) {
    outId = splitPane(ctx.paneId);
    ctx.pane.plotOutputId = outId;
    const out = getPane(outId);
    if (out) out.tagEl.textContent = 'plot-out Del';
  }
  setPaneDisplay(outId, svg);
});

// ── Persistence (session) ──────────────────────────────────────────────────────

const KEY = 'dunno-state';

let _clearPending = false;
register('42clear', () => { _clearPending = true; localStorage.removeItem(KEY); location.reload(); });

function _sessionSave() {
  if (_clearPending) return;
  try {
    const state = getState();
    state.dark = document.body.classList.contains('dark');
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch {}
}

function _sessionLoad() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return false;
    const state = JSON.parse(raw);
    document.body.classList.toggle('dark', state.dark ?? true);
    restoreState(state);
    return true;
  } catch { return false; }
}

// ── Bootstrap ──────────────────────────────────────────────────────────────────

const WELCOME = `dunno  —  inspired by Plan 9's Acme

Right-click any command word to execute it.
Right-click Help for commands. Select a word first for topic help.`;

async function _init() {
  await loadVersion();
  if (!_sessionLoad()) {
    const col = createColumn();
    createPane(col, WELCOME);
  }
}

window.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); _sessionSave(); }
});
window.addEventListener('beforeunload', _sessionSave);
setInterval(_sessionSave, 30_000);

_init();
